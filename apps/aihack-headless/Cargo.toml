[package]
name = "aihack-headless"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aihack-headless"
path = "src/main.rs"

[dependencies]
aihack-ai-contract = { path = "../../crates/aihack-ai-contract", version = "0.1.0" }
aihack-runtime = { path = "../../crates/aihack-runtime", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
