[package]
name = "aihack-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[dependencies]
aihack-ai-contract = { path = "../aihack-ai-contract", version = "0.1.0" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
